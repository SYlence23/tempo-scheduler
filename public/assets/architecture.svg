<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc">
<title id="title">Архітектура Tempo</title><desc id="desc">Браузер звертається до Nginx, який балансує два API. Обидва API та воркери використовують PostgreSQL. Autoscaler керує кількістю воркерів від двох до чотирьох.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#527367" stroke-width="1.5"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#193c32}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px;fill:#5d7169}.box{fill:#fff;stroke:#c7d7ce;stroke-width:1.5}.line{fill:none;stroke:#527367;stroke-width:2;marker-end:url(#arrow)}.light{fill:#eaf2e9}.accent{fill:#d9edb0}</style></defs>
<rect width="1120" height="880" rx="24" fill="#f4f6ef"/>
<text x="48" y="57" class="title">Tempo · оптимізація розкладу</text><text x="48" y="83" class="small">Два API, асинхронні обчислення, одна PostgreSQL-черга</text>
<rect x="430" y="115" width="260" height="73" rx="16" class="box"/><text x="560" y="145" text-anchor="middle" class="label">Браузер</text><text x="560" y="168" text-anchor="middle" class="small">Інтерфейс · JWT · SSE · Гант</text>
<path d="M560 188V225" class="line"/><text x="575" y="211" class="small">HTTP / HTTPS</text>
<rect x="390" y="230" width="340" height="83" rx="16" fill="#193c32"/><text x="560" y="263" text-anchor="middle" style="fill:white" class="label">Nginx · least_conn</text><text x="560" y="288" text-anchor="middle" style="fill:#d6e4da" class="small">Один вхід · вибір найменш зайнятого API</text>
<path d="M480 313V345H295V368" class="line"/><path d="M640 313V345H825V368" class="line"/>
<rect x="165" y="374" width="260" height="85" rx="16" class="box"/><text x="295" y="406" text-anchor="middle" class="label">API_1 · Express</text><text x="295" y="432" text-anchor="middle" class="small">Авторизація · задачі · історія</text>
<rect x="695" y="374" width="260" height="85" rx="16" class="box"/><text x="825" y="406" text-anchor="middle" class="label">API_2 · Express</text><text x="825" y="432" text-anchor="middle" class="small">Та сама логіка · спільні дані</text>
<path d="M295 459V492H465V514" class="line"/><path d="M825 459V492H655V514" class="line"/>
<rect x="365" y="520" width="390" height="105" rx="18" class="accent" stroke="#a5bc83"/><text x="560" y="551" text-anchor="middle" class="label">PostgreSQL</text><text x="560" y="579" text-anchor="middle" class="small">users · jobs · nodes · settings</text><text x="560" y="603" text-anchor="middle" class="small">Черга, результат, прогрес та стан воркерів</text>
<path d="M435 625V660H230V690" class="line"/><path d="M560 625V690" class="line"/><path d="M685 625V660H890V690" class="line"/>
<rect x="75" y="696" width="310" height="101" rx="16" class="box"/><text x="230" y="727" text-anchor="middle" class="label">WORKER_1 · WORKER_2</text><text x="230" y="752" text-anchor="middle" class="small">Постійні обробники</text><text x="230" y="775" text-anchor="middle" class="small">Один worker_thread на розрахунок</text>
<rect x="415" y="696" width="290" height="101" rx="16" class="box"/><text x="560" y="727" text-anchor="middle" class="label">WORKER_3 · WORKER_4</text><text x="560" y="752" text-anchor="middle" class="small">Резерв за навантаженням</text><text x="560" y="775" text-anchor="middle" class="small">Локально запускає Supervisor</text>
<rect x="740" y="696" width="310" height="101" rx="16" class="light" stroke="#c7d7ce"/><text x="895" y="727" text-anchor="middle" class="label">Autoscaler + Supervisor</text><text x="895" y="752" text-anchor="middle" class="small">Черга → бажана кількість 2–4</text><text x="895" y="775" text-anchor="middle" class="small">Запуск / зупинка резерву</text>
<text x="48" y="839" class="small">Захоплення задачі: UPDATE … FROM (SELECT … FOR UPDATE SKIP LOCKED) · без Redis / RabbitMQ</text>
</svg>
